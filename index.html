<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananta</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.chat-container::-webkit-scrollbar { width: 8px; }
.chat-container::-webkit-scrollbar-thumb { background-color: #4f46e5; border-radius: 4px; }
.chat-container::-webkit-scrollbar-track { background-color: #374151; }
</style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

<div class="w-full max-w-6xl mx-auto bg-gray-800 rounded-lg shadow-2xl flex" style="height: 90vh;">

  <!-- Left Panel: File Manager -->
  <div class="w-1/3 bg-gray-800/50 p-6 rounded-l-lg border-r border-gray-700 flex flex-col">
    <h2 class="text-2xl font-bold mb-4 text-indigo-400">File Manager</h2>

    <!-- File Upload -->
    <div class="bg-gray-700 p-4 rounded-lg mb-6">
      <h3 class="text-lg font-semibold mb-3 text-gray-200">Upload a File</h3>
      <input type="file" id="fileInput" class="block w-full text-sm text-gray-400
        file:mr-4 file:py-2 file:px-4
        file:rounded-full file:border-0
        file:text-sm file:font-semibold
        file:bg-indigo-500 file:text-white
        hover:file:bg-indigo-600 transition-colors cursor-pointer mb-3">
      <button id="uploadButton" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-full transition-colors">
        Upload
      </button>
    </div>

    <!-- File List -->
    <div class="bg-gray-700 p-4 rounded-lg flex-grow overflow-y-auto">
    <h3 class="text-lg font-semibold mb-3 text-gray-200">Available Files</h3>
      <ul id="fileList" class="space-y-2">
        <!-- File list will be populated here -->
      </ul>
    </div>
    <div class="mt-4 text-xs text-center text-gray-500">
      <p>Proxy Server at: <span id="proxy-address"></span></p>
    </div>
  </div>

  <!-- Right Panel: Ollama Chat -->
  <div class="w-2/3 p-6 flex flex-col">
    <h2 class="text-2xl font-bold mb-4 text-indigo-400">Ananta</h2>

    <div class="flex items-center mb-4 space-x-2">
      <input id="ws-url" type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 text-sm" placeholder="ws://localhost:8765">
      <input id="model" type="text" value="llama3:8b" class="w-1/2 bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 text-sm" placeholder="llama3:8b">
    </div>

    <div id="chat-container" class="chat-container flex-grow bg-gray-900 rounded-lg p-4 overflow-y-auto mb-4 space-y-4">
      <div class="text-gray-400 text-center p-4">No messages yet. Start by sending a prompt.</div>
    </div>

    <div class="flex space-x-2">
      <textarea id="prompt" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none" rows="2" placeholder="Type your message to Ollama..."></textarea>
      <button id="sendMessageBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition-colors">
        Send
      </button>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const uploadButton = document.getElementById('uploadButton');
const fileList = document.getElementById('fileList');
const wsUrlInput = document.getElementById('ws-url');
const modelInput = document.getElementById('model');
const promptInput = document.getElementById('prompt');
const sendMessageBtn = document.getElementById('sendMessageBtn');
const chatContainer = document.getElementById('chat-container');
const proxyAddress = document.getElementById('proxy-address');

// Server configuration
const serverHost = '10.93.149.12'; 
const httpPort = 8080;  // proxy server port
const wsPort = 8765;

wsUrlInput.value = `ws://${serverHost}:${wsPort}`;
proxyAddress.textContent = `http://${serverHost}:${httpPort}`;

// --- Fetch list of files from /list endpoint ---
 async function fetchFileList() {
   try {
       const response = await fetch(`http://${serverHost}:${httpPort}/list`);
       if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
       const files = await response.json();
        fileList.innerHTML = '';
        if (files.length === 0) {
            fileList.innerHTML = '<li class="text-gray-400 text-sm">No files available.</li>';
           return;
       }
        files.forEach(file => {
           const li = document.createElement('li');
            li.className = 'flex items-center justify-between bg-gray-800 p-2 rounded-md text-sm';

           const fileNameSpan = document.createElement('span');
          fileNameSpan.textContent = file;
           fileNameSpan.className = "truncate pr-2";
            li.appendChild(fileNameSpan);

            const downloadLink = document.createElement('a');
           downloadLink.href = `http://${serverHost}:${httpPort}/Files/${file}`;
            downloadLink.textContent = 'Download';
          downloadLink.target = '_blank';
          downloadLink.className = 'bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded-full text-xs transition-colors no-underline flex-shrink-0';
         li.appendChild(downloadLink);
            fileList.appendChild(li);
       });
    } catch (error) {
        console.error("Failed to fetch file list:", error);
        fileList.innerHTML = '<li class="text-red-400 text-sm">Error loading files.</li>';
    }
} 

// --- Upload file ---
uploadButton.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) return alert("Please select a file to upload.");
    try {
        const response = await fetch(`http://${serverHost}:${httpPort}/${file.name}`, {
            method: 'PUT',
            body: file,
            headers: {'Content-Type': 'application/octet-stream'}
        });
        if (response.ok) {
            alert('File uploaded successfully!');
            fetchFileList();
            fileInput.value = '';
        } else {
            throw new Error(`Upload failed with status: ${response.status}`);
        }
    } catch (error) {
        console.error("Upload error:", error);
        // alert("File upload failed.");
    }
});

// --- WebSocket Chat ---
let socket = null;

function connectSocket() {
    const url = wsUrlInput.value;
    if (!url) return alert("WebSocket URL cannot be empty.");
    socket = new WebSocket(url);

    socket.onopen = () => addMessage("System", `Connected to WebSocket server at ${url}`);
    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.response) addMessage("Ollama", data.response);
            else if (data.error) addMessage("Error", `${data.error}\n${data.detail || ''}`);
            else addMessage("Unknown", event.data);
        } catch { addMessage("Raw", event.data); }
    };
    socket.onerror = (err) => addMessage("System", "WebSocket error occurred. Check console.");
    socket.onclose = () => addMessage("System", "WebSocket connection closed.");
}

function addMessage(sender, text) {
    if (chatContainer.querySelector('.text-gray-400')) chatContainer.innerHTML = '';
    const messageElem = document.createElement('div');
    messageElem.className = 'p-3 rounded-lg';
    const senderSpan = document.createElement('span');
    senderSpan.className = 'font-bold block mb-1';
    if (sender === 'You') { messageElem.className += ' bg-indigo-800 self-end'; senderSpan.textContent = 'You'; senderSpan.className += ' text-indigo-300'; }
    else if (sender === 'Ollama') { messageElem.className += ' bg-gray-700'; senderSpan.textContent = 'Ollama'; senderSpan.className += ' text-green-300'; }
    else { messageElem.className += ' bg-red-900'; senderSpan.textContent = sender; senderSpan.className += ' text-red-300'; }
    const textNode = document.createElement('pre');
    textNode.className = 'whitespace-pre-wrap font-sans text-sm';
    textNode.textContent = text;
    messageElem.appendChild(senderSpan);
    messageElem.appendChild(textNode);
    chatContainer.appendChild(messageElem);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function handleSend() {
    const message = promptInput.value;
    const model = modelInput.value;
    if (!message.trim()) return;
    addMessage('You', message);
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        connectSocket();
        setTimeout(() => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ message, model })); }, 1000);
    } else socket.send(JSON.stringify({ message, model }));
    promptInput.value = '';
}

sendMessageBtn.addEventListener('click', handleSend);
promptInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

document.addEventListener('DOMContentLoaded', () => {
    fetchFileList();
    connectSocket();
});
</script>

</body>
</html>
